<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents — KK Brand & Content Hub</title>
<style>
:root{
  --ink:#0A0A0A;--navy:#0D2B6E;--blue:#1B4F9B;
  --gold:#C8922A;--gold-bg:#FBF5E8;--gold-mid:#E8C879;
  --surface:#FAFAF8;--border:#E8E4DC;--gray:#5D6D7E;
  --shadow:0 3px 18px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#F5F3EF;color:var(--ink)}
a{color:var(--blue);text-decoration:none}

/* ── SIDEBAR ── */
.sb{position:fixed;top:0;left:0;width:264px;height:100vh;background:var(--ink);overflow-y:auto;z-index:200;padding-bottom:24px}
.sb-brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-brand a{display:block;color:var(--gold);font-size:15px;font-weight:900}
.sb-brand p{color:rgba(255,255,255,.4);font-size:10px;margin-top:3px}
.sb-back{display:inline-flex;align-items:center;gap:6px;margin:12px 14px 4px;font-size:11px;font-weight:700;color:rgba(255,255,255,.6)}
.sb-back:hover{color:#fff}
.sb-group{padding:14px 14px 2px}
.sb-group-lbl{color:rgba(255,255,255,.32);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.sb-link{display:block;padding:9px 12px;border-radius:8px;color:rgba(255,255,255,.7);font-size:12.5px;font-weight:600;margin-bottom:3px;line-height:1.35;cursor:pointer;border-left:3px solid transparent}
.sb-link:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-link.active{background:rgba(200,146,42,.16);color:#fff;border-left-color:var(--gold)}

/* ── MAIN ── */
.main{margin-left:264px;min-height:100vh;display:flex;justify-content:center}
.doc-shell{max-width:860px;width:100%;padding:38px 48px 90px}
.doc-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.crumb{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.raw-link{margin-left:auto;font-size:11px;font-weight:700;color:var(--gray);border:1px solid var(--border);background:#fff;padding:5px 11px;border-radius:7px}
.raw-link:hover{border-color:var(--gold-mid);color:var(--ink)}
#status{padding:60px 10px;text-align:center;color:var(--gray);font-size:14px}
.spinner{width:26px;height:26px;border:3px solid #E8EDF4;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MARKDOWN STYLING ── */
.md{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:44px 52px;font-size:15px;line-height:1.7;color:#222}
.md h1{font-size:30px;font-weight:900;color:var(--navy);line-height:1.15;margin:0 0 6px;padding-bottom:14px;border-bottom:3px solid var(--gold)}
.md h2{font-size:22px;font-weight:900;color:var(--navy);margin:34px 0 10px;padding-top:10px}
.md h3{font-size:17px;font-weight:800;color:var(--blue);margin:24px 0 8px}
.md h4{font-size:14px;font-weight:800;color:var(--ink);margin:18px 0 6px}
.md p{margin:0 0 13px}
.md ul,.md ol{margin:0 0 14px;padding-left:24px}
.md li{margin-bottom:5px}
.md strong{color:var(--ink);font-weight:800}
.md a{color:var(--blue);border-bottom:1px solid rgba(27,79,155,.25)}
.md a:hover{border-bottom-color:var(--blue)}
.md hr{border:none;border-top:2px solid var(--border);margin:28px 0}
.md code{background:#F1ECE0;border-radius:5px;padding:1.5px 6px;font-family:'Consolas',monospace;font-size:13px;color:#7B3F00}
.md blockquote{border-left:4px solid var(--gold);background:var(--gold-bg);margin:0 0 14px;padding:10px 16px;border-radius:0 9px 9px 0;color:#4a3a16}
.md blockquote p{margin:0}
.md table{width:100%;border-collapse:collapse;margin:8px 0 22px;font-size:13px;box-shadow:var(--shadow);border-radius:10px;overflow:hidden}
.md thead th{background:var(--navy);color:#fff;text-align:left;padding:10px 13px;font-weight:800}
.md tbody td{padding:9px 13px;border-bottom:1px solid #EEE;vertical-align:top}
.md tbody tr:nth-child(even) td{background:#FAFBFE}
.md tbody tr:last-child td{border-bottom:none}

@media(max-width:980px){
  .sb{position:static;width:100%;height:auto}
  .main{margin-left:0}
  .doc-shell{padding:24px 16px 60px}
  .md{padding:28px 22px}
}
</style>
</head>
<body>

<nav class="sb">
  <div class="sb-brand">
    <a href="index.html">KK Brand &amp; Content Hub</a>
    <p>Documents</p>
  </div>
  <a class="sb-back" href="index.html">← Back to home</a>
  <div class="sb-group">
    <div class="sb-group-lbl">Strategy</div>
    <a class="sb-link" data-doc="strategy/instagram-growth-strategy-2026.md">📈 Instagram Growth Strategy 2026</a>
    <a class="sb-link" data-doc="strategy/social-media-content-plan-2026.md">🗂️ Social Media Content Plan 2026</a>
  </div>
  <div class="sb-group">
    <div class="sb-group-lbl">Research &amp; Reference</div>
    <a class="sb-link" data-doc="research/uae-real-estate-founders-linkedin.md">👤 UAE Real Estate Founders</a>
    <a class="sb-link" data-doc="research/proptech-event-companies-uae.md">🎤 PropTech Events &amp; Companies</a>
    <a class="sb-link" data-doc="research/proptech-ai-thought-leadership.md">💡 PropTech &amp; AI Thought Leadership</a>
  </div>
</nav>

<main class="main">
  <div class="doc-shell">
    <div class="doc-toolbar">
      <span class="crumb" id="crumb">Document</span>
      <a class="raw-link" id="rawlink" href="#" target="_blank" rel="noopener">View raw Markdown ↗</a>
    </div>
    <div id="status"><div class="spinner"></div>Loading document…</div>
    <article class="md" id="content" style="display:none"></article>
  </div>
</main>

<script src="assets/vendor/marked.min.js"></script>
<script>
// Whitelist of documents (path → sidebar label)
const DOCS = {
  "strategy/instagram-growth-strategy-2026.md": "Instagram Growth Strategy 2026",
  "strategy/social-media-content-plan-2026.md": "Social Media Content Plan 2026",
  "research/uae-real-estate-founders-linkedin.md": "UAE Real Estate Founders",
  "research/proptech-event-companies-uae.md": "PropTech Events & Companies",
  "research/proptech-ai-thought-leadership.md": "PropTech & AI Thought Leadership",
};
const DEFAULT_DOC = "strategy/instagram-growth-strategy-2026.md";

function getDocParam(){
  const p = new URLSearchParams(location.search).get("doc");
  return (p && Object.prototype.hasOwnProperty.call(DOCS, p)) ? p : DEFAULT_DOC;
}

function setActive(doc){
  document.querySelectorAll(".sb-link").forEach(l=>{
    l.classList.toggle("active", l.getAttribute("data-doc")===doc);
  });
  document.getElementById("crumb").textContent = DOCS[doc] || "Document";
  document.getElementById("rawlink").href = doc;
}

async function loadDoc(doc){
  const status = document.getElementById("status");
  const content = document.getElementById("content");
  content.style.display = "none";
  status.style.display = "block";
  status.innerHTML = '<div class="spinner"></div>Loading document…';
  setActive(doc);
  try{
    const res = await fetch(doc, {cache:"no-cache"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);
    status.style.display = "none";
    content.style.display = "block";
    document.title = (DOCS[doc]||"Document") + " — KK Hub";
    window.scrollTo(0,0);
  }catch(err){
    status.innerHTML = '<p style="font-weight:700;color:#C0392B">Could not load this document.</p>'+
      '<p style="margin-top:8px">'+err.message+'</p>'+
      '<p style="margin-top:14px;font-size:12.5px">If you opened this file directly (<code>file://</code>), browsers block local fetches. '+
      'Serve the folder over HTTP instead — e.g. <code>python3 -m http.server</code> — or view it on the deployed site. '+
      'You can also <a href="'+doc+'" target="_blank" rel="noopener">open the raw Markdown</a>.</p>';
  }
}

// Sidebar click → update URL (without reload) and load
document.querySelectorAll(".sb-link").forEach(l=>{
  l.addEventListener("click", e=>{
    e.preventDefault();
    const doc = l.getAttribute("data-doc");
    history.pushState({doc}, "", "docs.html?doc="+encodeURIComponent(doc));
    loadDoc(doc);
  });
});
window.addEventListener("popstate", ()=>loadDoc(getDocParam()));

// marked config
if(window.marked) marked.setOptions({gfm:true, breaks:false});
loadDoc(getDocParam());
</script>
</body>
</html>
